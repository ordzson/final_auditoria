<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">La oficina después del incidente: boceto del juego de auditoría</title>
<desc id="desc">Tres momentos: apertura de diez planos y trece registros con caída del CRM y nota de extorsión ilustrativa; exploración en primera persona de una única oficina con seis estaciones, un enlace de TI y tablita en mano; y una libreta que documenta conclusiones estructuradas con sus fuentes y límites.</desc>

