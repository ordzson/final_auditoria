<text x="56" y="54" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526a6c" font-weight="700">REDNOVA  /  OPERACIÓN TRAZABILIDAD</text>
<text x="56" y="108" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#213d41" font-weight="700">La oficina después del incidente</text>
<text x="56" y="145" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#596d6c" font-weight="400">Reconstruir lo registrado. Explorar la oficina. Contrastar fuentes. Documentar.</text>
