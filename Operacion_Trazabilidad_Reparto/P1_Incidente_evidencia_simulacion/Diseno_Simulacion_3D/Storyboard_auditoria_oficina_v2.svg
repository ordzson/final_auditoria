<text x="78" y="745" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#5b6c69" font-weight="400">10 planos · 13 registros · 110 segundos.</text>
<text x="78" y="774" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#5b6c69" font-weight="400">Encuadres y luz guían la reconstrucción.</text>
<text x="78" y="803" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#5b6c69" font-weight="400">Caída del CRM y nota ilustrativa.</text>
<text x="78" y="832" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#5b6c69" font-weight="400">Después entramos como auditores.</text>
